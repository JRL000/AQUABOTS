## Managed components for the AQUABOTS ESP32-S3 firmware.
##
## The swarm code itself is self-contained, but sensor_bridge.c depends on
## Espressif's 1-Wire bus + DS18B20 drivers, which ship as managed
## components via the ESP Component Registry.  `idf.py build` will fetch
## them into firmware/managed_components/ on first build.

dependencies:
  idf:
    version: ">=5.1"

  espressif/onewire_bus:
    version: "^1.0.2"

  espressif/ds18b20:
    version: "^0.1.3"
