<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AquaBot Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        table { width:100%; border-collapse:collapse; }
        table th, table td { border:1px solid rgba(255,255,255,0.15); padding:6px; font-size:13px; }
        table th { background:rgba(255,255,255,0.05); }

        .button-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
        .button-grid button { width:100%; }

        .overlay-active  { background-color:#0077ff !important; }
        .recording-active{ background-color:#00c853 !important; color:white !important; }

        /* Mission panel */
        #missionPhaseBadge {
            text-align:center;
            padding:9px 8px 5px;
            border-radius:6px;
            border:2px solid #888;
            background:#1a1a1a;
            color:#888;
            font-weight:700;
            font-size:13px;
            letter-spacing:1px;
        }
        #missionWPProgress {
            font-size:11px;
            font-weight:400;
            letter-spacing:0;
            min-height:1.3em;
            margin-top:3px;
            color:inherit;
            opacity:0.8;
        }
        #missionStatus {
            font-size:13px;
            font-weight:600;
            color:#66ff88;
            word-break:break-word;
            background:rgba(0,0,0,0.35);
            border-radius:4px;
            padding:5px 7px;
            border-left:3px solid #66ff88;
            margin-top:7px;
        }
        #missionStatus:empty { display:none; }

        .mac-btn { width:100%; margin-top:5px; font-weight:700; padding:9px 6px; }
        #btnStartMission  { background:#006600; color:white; font-size:14px; padding:10px 6px; }
        #btnResumeMission { background:#005500; color:white; }
        #btnHoldMission   { background:#885500; color:white; }
        #btnRTH           { background:#880000; color:white; }
        #btnAbortMission  { background:#440000; color:#ff9999; font-size:12px; }

        /* Record indicator */
        #recordIndicator { position:absolute; top:10px; left:10px; background:red;
            padding:6px 12px; border-radius:6px; font-weight:bold; display:none; }
    </style>
</head>

<body>

<div class="header">
    <h1>AquaBot Dashboard</h1>
    <p>Team 26061 | University of Arizona</p>
</div>

<div class="container">

    <!-- MAP -->
    <div class="panel-column">
        <h2 class="panel-title">Geo Overlay</h2>
        <div class="panel geo-panel">
            <div id="map" style="height:100%; width:100%; border-radius:8px;"></div>
        </div>
    </div>

    <!-- VIDEO -->
    <div class="panel-column">
        <h2 class="panel-title">Live Video Stream</h2>

        <div class="panel video-panel" style="position:relative;">
            <video id="webrtcVideo"
                   autoplay
                   playsinline
                   muted
                   style="width:100%; height:100%; background:black; border-radius:8px;">
            </video>

            <div id="recordIndicator"
                 style="position:absolute;
                        top:10px;
                        left:10px;
                        background:red;
                        padding:6px 12px;
                        border-radius:6px;
                        font-weight:bold;
                        display:none;">
                ● REC
            </div>
        </div>
    </div>

</div>

<!-- ================= BOTTOM ROW ================= -->
<div class="bottom-row">

    <!-- TELEMETRY TABLE -->
    <div class="sensor-data" style="flex:2;">
        <h3>Telemetry Log (Last 5)</h3>
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Lat</th>
                    <th>Lon</th>
                    <th>Temp (°C)</th>
                    <th>pH</th>
                    <th>Sal</th>
                </tr>
            </thead>
            <tbody id="telemetryTableBody"></tbody>
        </table>
    </div>

    <!-- MAP CONTROLS + OVERLAYS -->
    <div class="buttons">

        <h3>Controls</h3>

        <div class="button-grid">
            <button id="zoomIn">Zoom In</button>
            <button id="zoomOut">Zoom Out</button>
            <button id="startRecord">Start Recording</button>
            <button id="stopRecord">Stop Recording</button>
        </div>

        <h3 style="margin-top:15px;">Sensor Overlays</h3>

        <div class="button-grid">
            <button id="toggleTemp">Temp</button>
            <button id="togglePH">pH</button>
            <button id="toggleSal">Salinity</button>
            <button id="clearOverlay">Clear</button>
        </div>

    </div>

    <!-- STATUS + MOTOR + THROTTLE -->
    <div class="video-stats">

        <p>
            <strong>Video Latency:</strong>
            <span id="videoLatency">--</span> ms
        </p>

        <p>
            <strong>Speed:</strong>
            <span id="speedKnots">0.0</span> kn
        </p>

        <p>
            <strong>GPS Fix:</strong>
            <span id="gpsFix"
                  style="display:inline-block;
                         width:14px;
                         height:14px;
                         border-radius:50%;
                         background:red;">
            </span>
        </p>

        <p>
            <strong>Recording:</strong>
            <span id="recordStatus"
                  style="display:inline-block;
                         width:14px;
                         height:14px;
                         border-radius:50%;
                         background:red;">
            </span>
        </p>

        <p>
            <strong>Mode:</strong>
            <span id="currentMode" style="font-weight:600; color:#aaddff;">--</span>
        </p>

        <h3 style="margin-top:20px;">Motor Safety</h3>

        <button id="btnArmDisarm" style="width:100%;" onclick="toggleArmDisarm()">ARM</button>

        <button id="btnSlowMode" style="width:100%; margin-top:6px;" onclick="toggleSlowMode()">SLOW MODE: OFF</button>

    </div>

    <!-- MISSION CONTROL -->
    <div class="buttons" style="flex:1; min-width:210px;">

        <!-- Phase badge — updated by state machine in controls.js -->
        <div id="missionPhaseBadge">
            <span id="missionPhaseLabel">IDLE</span>
            <div id="missionWPProgress"></div>
        </div>

        <!-- Status / Pixhawk messages — hidden when empty -->
        <div id="missionStatus"></div>

        <!-- Planning (always available) -->
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; margin-top:8px;">
            <button id="btnPlaceWaypoints" style="margin:0; font-size:11px; padding:7px 4px;">Place WPs</button>
            <button id="btnClearWaypoints" style="margin:0; font-size:11px; padding:7px 4px;">Clear</button>
            <button id="btnUploadMission"  style="margin:0; font-size:11px; padding:7px 4px;">Upload</button>
        </div>

        <!-- Dynamic action buttons — shown/hidden by phase state machine -->
        <button id="btnStartMission"  class="mac-btn" style="display:none;">START MISSION</button>
        <button id="btnResumeMission" class="mac-btn" style="display:none;">RESUME</button>
        <button id="btnHoldMission"   class="mac-btn" style="display:none;">HOLD</button>
        <button id="btnRTH"           class="mac-btn" style="display:none;">RETURN HOME</button>
        <button id="btnAbortMission"  class="mac-btn" style="display:none;">ABORT (DISARM)</button>

    </div>

</div>



<script src="{{ url_for('static', filename='js/webrtc.js') }}"></script>
<script src="{{ url_for('static', filename='js/controls.js') }}"></script>

</body>
</html>
